{% extends 'base.html' %}

{% block conteudo %}
<h2>Desenvolvedoras</h2>
<a href="{{ url_for('desenvolvedoras.nova') }}">Nova desenvolvedora</a>

<ul>
    {% for desenvolvedora in desenvolvedoras %}
        <li>
            {{ desenvolvedora.nome }}
            <a href="{{ url_for('desenvolvedoras.detalhes', id=desenvolvedora.id) }}">Ver</a>
            <a href="{{ url_for('desenvolvedoras.editar', id=desenvolvedora.id) }}">Editar</a>
            <form action="{{ url_for('desenvolvedoras.excluir', id=desenvolvedora.id) }}" method="post">
                <button type="submit">Excluir</button>
            </form>
        </li>
    {% endfor %}
</ul>
{% endblock %}
