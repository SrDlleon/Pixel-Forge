{% extends 'base.html' %}

{% block conteudo %}
<h2>Jogos</h2>
<a href="{{ url_for('jogos.novo_jogo') }}">Novo jogo</a>

<ul>
    {% for jogo in jogos %}
        <li>
            {{ jogo.titulo }} - {{ jogo.desenvolvedora.nome }}
            <a href="{{ url_for('jogos.detalhar_jogo', id=jogo.id) }}">Ver</a>
            <a href="{{ url_for('jogos.editar_jogo', id=jogo.id) }}">Editar</a>
            <form action="{{ url_for('jogos.excluir_jogo', id=jogo.id) }}" method="post">
                <button type="submit">Excluir</button>
            </form>
        </li>
    {% endfor %}
</ul>
{% endblock %}
