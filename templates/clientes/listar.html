{% extends 'base.html' %}

{% block conteudo %}
<h2>Clientes</h2>
<a href="{{ url_for('clientes.novo') }}">Novo cliente</a>

<ul>
    {% for cliente in clientes %}
        <li>
            {{ cliente.nome }}
            <a href="{{ url_for('clientes.perfil', id=cliente.id) }}">Ver</a>
            <a href="{{ url_for('clientes.editar', id=cliente.id) }}">Editar</a>
            <form action="{{ url_for('clientes.excluir', id=cliente.id) }}" method="post">
                <button type="submit">Excluir</button>
            </form>
        </li>
    {% endfor %}
</ul>
{% endblock %}
