{% extends 'base.html' %}

{% block titulo %}{{ titulo }} | Pixel Forge{% endblock %}

{% block conteudo %}
<h1>{{ titulo }}</h1>

<form class="cartao formulario" method="post" action="{{ acao }}">
    <label for="nome">Nome</label>
    <input id="nome" name="nome" type="text" maxlength="255" value="{{ cliente.nome if cliente else '' }}" required>

    <label for="email">Email</label>
    <input id="email" name="email" type="email" maxlength="255" value="{{ cliente.email if cliente else '' }}" required>

    <label for="senha">Senha</label>
    <input id="senha" name="senha" type="password" {% if not cliente %}required{% endif %}>
    {% if cliente %}
        <p class="ajuda">Deixe a senha em branco para manter a senha atual.</p>
    {% endif %}

    <div class="acoes">
        <button class="botao" type="submit">Salvar</button>
        <a href="{{ url_for('clientes.listar') }}">Cancelar</a>
    </div>
</form>
{% endblock %}
